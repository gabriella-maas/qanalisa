relationships:
  - from_module: Financeiro
    from_feature: Conta a Pagar
    to_module: Fiscal
    to_feature: Recebimento de Nota Fiscal
    reason: A documentação da Consulta de Conta a Pagar informa que títulos podem ser gerados a partir do recebimento de nota fiscal.
    provenance: documented
    source_ids:
      - financeiro-conta-a-pagar
    risks:
      - Em alterações na geração de títulos originados por Nota Fiscal, validar o fluxo ponta a ponta entre recebimento e Contas a Pagar.
  - from_module: Financeiro
    from_feature: Conta a Pagar
    to_module: Financeiro
    to_feature: Baixa de Título
    reason: A documentação de Conta a Pagar contempla títulos baixados e período de baixa; a Consulta de Baixa de Título opera sobre contas a pagar e a receber.
    provenance: documented
    source_ids:
      - financeiro-conta-a-pagar
      - financeiro-baixa-titulo
    risks:
      - Em alterações de valor ou desconto do título, considerar regressão da baixa e dos totais baixados.
  - from_module: Financeiro
    from_feature: Banco e Conta Corrente
    to_module: Financeiro
    to_feature: Baixa de Título
    reason: O cadastro de Banco e Conta Corrente é utilizado posteriormente durante a Baixa de Títulos para indicar a conta envolvida nos valores e pagamentos.
    provenance: documented
    source_ids:
      - financeiro-banco-conta-corrente
    risks:
      - Validar o uso da conta corrente em operações de baixa quando o cadastro bancário for alterado.
  - from_module: Financeiro
    from_feature: Banco e Conta Corrente
    to_module: Financeiro
    to_feature: Tesouraria
    reason: A documentação informa que contas correntes são utilizadas também pelos PDVs para a Tesouraria.
    provenance: documented
    source_ids:
      - financeiro-banco-conta-corrente
    risks:
      - Validar reflexos em movimentações da Tesouraria quando o cadastro bancário for alterado.
